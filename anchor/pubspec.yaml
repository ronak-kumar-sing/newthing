name: anchor
description: "Anchor — Personal Student Life OS. A unified dashboard for self-awareness, discipline, and daily rhythm."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Database
  drift: ^2.26.0
  drift_flutter: ^0.2.4
  sqlite3_flutter_libs: ^0.5.32

  # Networking
  dio: ^5.8.0

  # Window Management (desktop only)
  window_manager: ^0.4.3
  screen_retriever: ^0.2.0

  # UI
  fl_chart: ^0.70.2
  shimmer: ^3.0.0
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0

  # Date/Time
  intl: ^0.20.2

  # Notifications
  flutter_local_notifications: ^19.4.0

  # Utils
  path_provider: ^2.1.5
  share_plus: ^10.1.4
  url_launcher: ^6.3.1
  uuid: ^4.5.1


  # Routing
  go_router: ^14.8.1

  # Icons
  cupertino_icons: ^1.0.8

  # Local storage
  shared_preferences: ^2.5.3

  # Permissions
  permission_handler: ^12.0.0
  file_picker: ^11.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  build_runner: ^2.4.15
  drift_dev: ^2.26.0
  riverpod_generator: ^2.6.5
  custom_lint: ^0.7.5
  riverpod_lint: ^2.6.5
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
